# Aggiorna le notizie in home 4 volte al giorno.
# Le notizie vanno sul ramo "notizie", che Netlify NON pubblica: nessun credito consumato.
name: Aggiorna notizie
on:
  schedule:
    - cron: "17 5,9,13,17 * * *"   # 6:17, 10:17, 14:17, 18:17 ora italiana (inverno)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recupera le notizie precedenti
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin notizie; then
            git show FETCH_HEAD:notizie.json > out/precedenti.json || echo '{"notizie":[]}' > out/precedenti.json
          else
            echo '{"notizie":[]}' > out/precedenti.json
          fi
      - name: Leggi i feed
        run: node scripts/aggiorna-notizie.mjs out/notizie.json out/precedenti.json
      - name: Pubblica sul ramo notizie
        run: |
          cd out
          rm -f precedenti.json
          git init -q -b notizie
          git config user.name "Aggiornamento notizie"
          git config user.email "actions@users.noreply.github.com"
          git add notizie.json
          git commit -q -m "Notizie aggiornate"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" notizie
